{% import "_icons.html" as icons %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} — CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <main class="main-content">
            <nav class="start-topbar">
                <a href="/" class="start-logo">CalendarName</a>
                <a href="/" class="btn-secondary btn-small">На главную</a>
            </nav>

            <section class="auth-shell">
                <p class="hero-eyebrow">{{ title }}</p>
                <h1>{{ title }}</h1>
                <p class="hero-description">{{ message }}</p>

                <div class="form-actions">
                    {% if login_link %}
                    <a href="/" class="btn-primary full-width">Войти</a>
                    {% else %}
                    <a href="/" class="btn-secondary full-width">На главную</a>
                    {% endif %}
                </div>
            </section>
        </main>
    </div>
</body>
</html>
