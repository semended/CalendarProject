<aside class="sidebar">
    <div class="logo center-logo">
        <a href="/main" style="text-decoration: none; color: inherit;">
            <h2>CalendarName</h2>
        </a>
    </div>

    <div class="nav-section">
        <h3 class="nav-title">ПРОЕКТЫ</h3>
        <ul class="nav-list">
            <li class="nav-item nav-item--create {% if active_page == 'create_task' %}active{% endif %}">
                <a href="/create_task" class="create-project-btn">
                    Создать проект
                </a>
            </li>


            <li class="nav-item {% if active_page == 'all_tasks' %}active{% endif %}">
                <a href="/main" class="nav-link">
                    <span class="nav-icon">📁</span>
                    <span>Все проекты</span>
                </a>
            </li>

            {% for project in tasks %}
            <li class="nav-item {% if task and task.id == project.id %}active{% endif %}">
                <a href="/task/{{ project.id }}" class="nav-link">
                    <span class="nav-icon">📄</span>
                    <span>{{ project.name }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</aside>
