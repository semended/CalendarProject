<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalendarName - {{ project.name }}</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="project-page">
    <div class="container">
        <!-- Сайдбар -->
        {% include 'sidebar.html' %}

        <!-- Основной контент -->
        <main class="main-content">
            <header class="page-header">
                <h2>{{ project.name }} - Задачи</h2>
            </header>

            <!-- Статистика -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalTasks">0</div>
                    <div class="stat-label">Всего задач</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="inProgressTasks">0</div>
                    <div class="stat-label">Задач в работе</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedTasks">0</div>
                    <div class="stat-label">Завершено задач</div>
                </div>
            </div>

            <!-- Доски задач -->
            <div class="boards">
                <div class="board">
                    <div class="board-header">
                        <h3>задачи в работе</h3>
                        <button class="sort-btn">сортировка</button>
                    </div>
                    <div class="task-list" id="inProgressList">
                        <!-- Задачи добавляются динамически -->
                    </div>
                    <button class="add-task-btn" onclick="addTask('inProgress')">+ Добавить задачу</button>
                </div>

                <div class="board">
                    <div class="board-header">
                        <h3>Завершенные задачи</h3>
                        <button class="sort-btn">сортировка</button>
                    </div>
                    <div class="task-list" id="completedList">
                        <!-- Задачи добавляются динамически -->
                    </div>
                    <button class="add-task-btn" onclick="addTask('completed')">+ Добавить задачу</button>
                </div>
            </div>
        </main>

        <!-- Правая панель -->
        <aside class="right-sidebar">
            <a href="/project_management/{{ project.id }}" class="manage-btn-link">
                <button class="manage-btn">управление проектом</button>
            </a>

            <div class="project-info">
                <h3>Команда проекта</h3>
                <div class="team-list" id="teamList">
                    <p class="empty-state">список людей в проекте</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Модальное окно для добавления задачи -->
    <div class="modal" id="taskModal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить задачу</h3>
            <form id="taskForm">
                <div class="form-group">
                    <label for="taskTitle">Название задачи</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Описание</label>
                    <textarea id="taskDescription"></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Данные проекта
        const projectId = {{ project.id }};
        let tasks = {
            inProgress: [],
            completed: []
        };
        let taskIdCounter = 1;

        // Инициализация приложения
        document.addEventListener('DOMContentLoaded', function() {
            loadTasks();
            updateStats();
            initDragAndDrop();
            initSortButtons();
        });

        // Загрузка задач с сервера
        async function loadTasks() {
            try {
                const response = await fetch(`/api/project/${projectId}/tasks`);
                if (response.ok) {
                    const data = await response.json();
                    tasks.inProgress = data.inProgress || [];
                    tasks.completed = data.completed || [];
                    // Обновляем счетчик ID
                    const allTasks = [...tasks.inProgress, ...tasks.completed];
                    if (allTasks.length > 0) {
                        taskIdCounter = Math.max(...allTasks.map(t => t.id)) + 1;
                    }
                    renderTasks();
                }
            } catch (error) {
                console.error('Ошибка загрузки задач:', error);
            }
        }

        // Сохранение задач на сервер
        async function saveTasks() {
            try {
                const response = await fetch(`/api/project/${projectId}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(tasks)
                });
                if (!response.ok) {
                    console.error('Ошибка сохранения задач');
                }
            } catch (error) {
                console.error('Ошибка сохранения задач:', error);
            }
        }

        // Функция добавления задачи
        async function addTask(status) {
            const title = prompt('Введите название задачи:');
            if (!title || !title.trim()) return;

            const task = {
                id: taskIdCounter++,
                title: title.trim(),
                status: status,
                createdAt: new Date().toLocaleDateString('ru-RU'),
                description: ''
            };

            tasks[status].push(task);
            await saveTasks();
            renderTasks();
            updateStats();
        }

        // Функция удаления задачи
        async function deleteTask(id, status) {
            if (!confirm('Удалить задачу?')) return;

            tasks[status] = tasks[status].filter(task => task.id !== id);
            await saveTasks();
            renderTasks();
            updateStats();
        }

        // Функция перемещения задачи
        async function moveTask(id, fromStatus, toStatus) {
            const taskIndex = tasks[fromStatus].findIndex(task => task.id === id);
            if (taskIndex === -1) return;

            const task = tasks[fromStatus][taskIndex];
            tasks[fromStatus].splice(taskIndex, 1);
            task.status = toStatus;
            tasks[toStatus].push(task);

            await saveTasks();
            renderTasks();
            updateStats();
        }

        // Отрисовка задач
        function renderTasks() {
            // Отрисовка задач в работе
            const inProgressList = document.getElementById('inProgressList');
            inProgressList.innerHTML = '';

            tasks.inProgress.forEach(task => {
                const taskCard = createTaskCard(task, 'inProgress');
                inProgressList.appendChild(taskCard);
            });

            // Отрисовка завершенных задач
            const completedList = document.getElementById('completedList');
            completedList.innerHTML = '';

            tasks.completed.forEach(task => {
                const taskCard = createTaskCard(task, 'completed');
                completedList.appendChild(taskCard);
            });
        }

        // Создание карточки задачи
        function createTaskCard(task, status) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            card.dataset.id = task.id;
            card.dataset.status = status;

            card.innerHTML = `
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                    <span>${task.createdAt}</span>
                    <span style="cursor: pointer;" onclick="deleteTask(${task.id}, '${status}')">🗑️</span>
                </div>
            `;

            // Двойной клик для перемещения между статусами
            card.addEventListener('dblclick', () => {
                const newStatus = status === 'inProgress' ? 'completed' : 'inProgress';
                moveTask(task.id, status, newStatus);
            });

            return card;
        }

        // Обновление статистики
        function updateStats() {
            const total = tasks.inProgress.length + tasks.completed.length;
            document.getElementById('totalTasks').textContent = total;
            document.getElementById('inProgressTasks').textContent = tasks.inProgress.length;
            document.getElementById('completedTasks').textContent = tasks.completed.length;
        }

        // Инициализация Drag and Drop
        function initDragAndDrop() {
            let draggedElement = null;

            document.addEventListener('dragstart', function(e) {
                if (e.target.classList.contains('task-card')) {
                    draggedElement = e.target;
                    e.target.classList.add('dragging');
                }
            });

            document.addEventListener('dragend', function(e) {
                if (e.target.classList.contains('task-card')) {
                    e.target.classList.remove('dragging');
                }
            });

            const taskLists = document.querySelectorAll('.task-list');

            taskLists.forEach(list => {
                list.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    const afterElement = getDragAfterElement(list, e.clientY);
                    if (afterElement == null) {
                        list.appendChild(draggedElement);
                    } else {
                        list.insertBefore(draggedElement, afterElement);
                    }
                });

                list.addEventListener('drop', async function(e) {
                    e.preventDefault();
                    if (!draggedElement) return;

                    const taskId = parseInt(draggedElement.dataset.id);
                    const oldStatus = draggedElement.dataset.status;
                    const newStatus = list.id === 'inProgressList' ? 'inProgress' : 'completed';

                    if (oldStatus !== newStatus) {
                        await moveTask(taskId, oldStatus, newStatus);
                    }
                });
            });
        }

        // Вспомогательная функция для определения позиции при перетаскивании
        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.task-card:not(.dragging)')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;

                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Инициализация кнопок сортировки
        function initSortButtons() {
            document.querySelectorAll('.sort-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const board = this.closest('.board');
                    const listId = board.querySelector('.task-list').id;
                    const status = listId === 'inProgressList' ? 'inProgress' : 'completed';

                    tasks[status].sort((a, b) => a.title.localeCompare(b.title));
                    saveTasks();
                    renderTasks();
                });
            });
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('taskModal').classList.remove('active');
            document.getElementById('taskForm').reset();
        }

        // Обработчик формы
        document.getElementById('taskForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('taskTitle').value.trim();
            const description = document.getElementById('taskDescription').value.trim();

            if (title) {
                // Здесь можно добавить логику для определения статуса
                addTask('inProgress');
                closeModal();
            }
        });
    </script>
</body>
</html>
