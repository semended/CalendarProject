{% import "_icons.html" as icons %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <main class="main-content">
            <nav class="start-topbar">
                <a href="/" class="start-logo">CalendarName</a>
            </nav>

            <section class="auth-shell">
                <p class="hero-eyebrow">Сброс пароля · задай новый</p>
                <h1>Новый&nbsp;<em>пароль</em>.</h1>
                <p class="hero-description">
                    Минимум шесть символов. После сохранения старый пароль перестанет работать сразу.
                </p>

                {% if error %}
                <div class="notice notice--error">
                    <span class="notice-icon">{{ icons.alert() }}</span>
                    <div class="notice-body">{{ error }}</div>
                </div>
                {% endif %}

                <form class="auth-form" method="POST" action="{{ url_for('password_reset_confirm', token=token) }}" autocomplete="off">
                    {% include '_csrf.html' %}
                    <div class="form-group">
                        <label for="pr_pwd">Новый пароль</label>
                        <input type="password" id="pr_pwd" name="password" placeholder="••••••" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="pr_pwd2">Ещё раз</label>
                        <input type="password" id="pr_pwd2" name="password2" placeholder="••••••" required minlength="6" autocomplete="new-password">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary full-width">Сохранить пароль</button>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
