<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль — CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1><a href="{{ url_for('start_page') }}" style="text-decoration:none; color:inherit;">CalendarName</a></h1>
                    <div class="breadcrumb">Задать новый пароль</div>
                </div>
            </header>

            <section class="hero-section">
                <div class="hero-content">
                    <h2>Новый пароль</h2>
                    <p class="hero-description">
                        Придумайте новый пароль (не короче 6 символов).
                    </p>

                    {% if error %}
                    <div class="error-container">
                        <div class="error-message">
                            <span class="error-icon">⚠️</span>
                            {{ error }}
                        </div>
                    </div>
                    {% endif %}

                    <div class="auth-section">
                        <form class="auth-form" method="POST" action="{{ url_for('password_reset_confirm', token=token) }}">
                            <div class="form-group">
                                <label for="pr_pwd">Новый пароль</label>
                                <input type="password" id="pr_pwd" name="password" placeholder="••••••" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="pr_pwd2">Ещё раз</label>
                                <input type="password" id="pr_pwd2" name="password2" placeholder="••••••" required minlength="6">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn-primary full-width">Сохранить</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
