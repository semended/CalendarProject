<!--версия без роутов и стайла в статике-->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - CalendarName</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f1f5f9;
            --bg-tertiary: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-tertiary: #64748b;
            --primary: #0ea5e9;
            --primary-light: #e0f2fe;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .error-icon {
            font-size: 8rem;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .error-description {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background-color: #0284c7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--bg-tertiary);
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary:hover {
            background-color: var(--bg-tertiary);
            transform: translateY(-2px);
            border-color: var(--text-tertiary);
        }

        .quick-links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        .quick-link {
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-secondary);
            transition: all 0.3s ease;
            border: 1px solid var(--bg-tertiary);
            text-align: center;
        }

        .quick-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            color: var(--primary);
            border-color: var(--primary-light);
        }

        .decoration {
            position: fixed;
            opacity: 0.1;
            font-size: 10rem;
            z-index: -1;
        }

        .decoration-1 {
            top: 10%;
            left: 10%;
        }

        .decoration-2 {
            bottom: 10%;
            right: 10%;
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 20px;
            }
            
            .error-icon {
                font-size: 6rem;
            }
            
            .error-code {
                font-size: 4rem;
            }
            
            .error-title {
                font-size: 1.5rem;
            }
            
            .error-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-primary, .btn-secondary {
                width: 100%;
                max-width: 250px;
            }
            
            .quick-links {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .error-icon {
                font-size: 4rem;
            }
            
            .error-code {
                font-size: 3rem;
            }
            
            .error-title {
                font-size: 1.25rem;
            }
            
            .error-description {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="decoration decoration-1">📅</div>
    <div class="decoration decoration-2">📋</div>

    <div class="error-container">
        <!-- Иконка -->
        <div class="error-icon">📄</div>
        
        <!-- Код ошибки -->
        <div class="error-code">404</div>
        
        <!-- Заголовок -->
        <h1 class="error-title">Страница не найдена</h1>
        
        <!-- Описание -->
        <p class="error-description">
            К сожалению, запрашиваемая страница не существует. 
            Возможно, она была перемещена или удалена. 
            Проверьте правильность адреса или вернитесь на главную страницу.
        </p>

        <!-- Действия -->
        <div class="error-actions">
            <a href="/" class="btn-primary">На главную</a>
            <a href="javascript:history.back()" class="btn-secondary">Вернуться назад</a>
        </div>

        <!-- Быстрые ссылки -->
        <div class="quick-links">
            <a href="/main" class="quick-link">Проекты</a>
            <a href="/calendar" class="quick-link">Календарь</a>
            <a href="/tasks" class="quick-link">Задачи</a>
            <a href="/help" class="quick-link">Помощь</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Простая логика для кнопок
            const quickLinks = document.querySelectorAll('.quick-link');
            quickLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    alert('Переход на страницу: ' + this.textContent);
                    // В реальном приложении: window.location.href = this.href;
                });
            });
        });
    </script>
</body>
</html>
