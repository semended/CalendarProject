<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <!-- Основной контент -->
        <main class="main-content">
            <div class="error-container">
                <!-- Иконка -->
                <div class="error-icon">📄</div>
                
                <!-- Код ошибки -->
                <div class="error-code">404</div>
                
                <!-- Заголовок -->
                <h1 class="error-title">Страница не найдена</h1>
                
                <!-- Описание -->
                <p class="error-description">
                    К сожалению, запрашиваемая страница не существует. 
                    Возможно, она была перемещена или удалена. 
                    Проверьте правильность адреса или вернитесь на главную страницу.
                </p>

                <!-- Действия -->
                <div class="error-actions">
                    <a href="javascript:history.back()" class="btn-secondary btn-back">Вернуться назад</a>
                    <a href="/" class="btn-primary btn-return">Вернуться в начало</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Убрана логика для быстрых ссылок, так как они удалены
        });
    </script>
</body>
</html>
