<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <!-- Основной контент -->
        <main class="main-content">
            <div class="not-found-container">
                <!-- Иконка -->
                <div class="not-found-icon">🔍</div>
                
                <!-- Код ошибки -->
                <div class="not-found-code">404</div>
                
                <!-- Заголовок -->
                <h1 class="not-found-title">Страница не найдена</h1>
                
                <!-- Описание -->
                <p class="not-found-description">
                    К сожалению, запрашиваемая страница не существует. 
                    Возможно, она была перемещена или удалена. 
                    Проверьте правильность адреса или вернитесь на главную страницу.
                </p>

                <!-- Действия -->
                <div class="not-found-actions">
                    <a href="javascript:history.back()" class="btn-secondary btn-back">Вернуться назад</a>
                    <a href="{{ url_for('start_page') }}" class="btn-primary btn-return">Вернуться в начало</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
