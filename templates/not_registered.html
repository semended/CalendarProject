{% import "_icons.html" as icons %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Требуется авторизация — CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <main class="main-content">
            <nav class="start-topbar">
                <a href="/" class="start-logo">CalendarName</a>
                <a href="/registration" class="btn-secondary btn-small">Создать аккаунт</a>
            </nav>

            <section class="auth-shell">
                <p class="auth-code">Access · 401</p>
                <h1>Нужно&nbsp;<em>войти</em>.</h1>

                    Эта страница доступна только авторизованным. Войди в&nbsp;аккаунт или зарегистрируйся&nbsp;— это быстро.
                </p>

                <div class="form-actions">
                    <a href="/" class="btn-primary full-width">Войти</a>
                    <a href="/registration" class="btn-secondary full-width">Регистрация</a>
                </div>
            </section>
        </main>
    </div>

</html>
