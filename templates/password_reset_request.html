<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — CalendarName</title>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container start-page">
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1><a href="{{ url_for('start_page') }}" style="text-decoration:none; color:inherit;">CalendarName</a></h1>
                    <div class="breadcrumb">Восстановление пароля</div>
                </div>
            </header>

            <section class="hero-section">
                <div class="hero-content">
                    <h2>Забыли пароль?</h2>
                    {% if sent %}
                        <p class="hero-description">
                            Если аккаунт с почтой <strong>{{ email }}</strong> существует,
                            мы отправили ссылку для сброса пароля. Ссылка живёт 1 час.
                        </p>
                        <div class="form-actions">
                            <a href="{{ url_for('start_page') }}" class="btn-primary full-width">На главную</a>
                        </div>
                    {% else %}
                        <p class="hero-description">
                            Введите почту — пришлём ссылку для восстановления.
                        </p>

                        <div class="auth-section">
                            <form class="auth-form" method="POST" action="{{ url_for('password_reset_request') }}">
                                <div class="form-group">
                                    <label for="pr_email">Почта</label>
                                    <input type="email" id="pr_email" name="email" placeholder="your@email.com" required>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary full-width">Отправить ссылку</button>
                                    <a href="{{ url_for('start_page') }}" class="btn-secondary full-width">Назад</a>
                                </div>
                            </form>
                        </div>
                    {% endif %}
                </div>
            </section>
        </main>
    </div>
</body>
</html>
